<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyGram</title>
    <style>
        :root {
            --bg-grad: radial-gradient(circle at top left, #1e1b4b, #0f172a 50%, #030712 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-card: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #6366f1;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.5);
            --neon-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --blur: blur(28px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-grad); height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-main); overflow: hidden; }

        .ambient-glow { position: absolute; width: 350px; height: 350px; background: rgba(99, 102, 241, 0.25); filter: blur(100px); border-radius: 50%; pointer-events: none; z-index: 0; }
        .glow-1 { top: -80px; left: -80px; }
        .glow-2 { bottom: -100px; right: -80px; background: rgba(192, 132, 252, 0.2); }

        .app-window {
            width: 100%; height: 100%; display: flex; position: relative;
            background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); z-index: 1; overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-window { width: 92vw; height: 92vh; border-radius: 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        }

        .sidebar {
            width: 340px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column;
            background: rgba(15, 23, 42, 0.45); z-index: 2; transition: transform 0.3s ease;
        }

        @media (max-width: 767px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area.active { transform: translateX(0); }
        }

        .side-header { padding: 18px 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-box span { font-weight: 800; font-size: 1.25rem; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .admin-badge {
            background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.5);
            color: #fbbf24; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 8px;
        }

        .tabs { display: flex; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); }
        .tab-btn { flex: 1; padding: 13px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); background: rgba(255,255,255,0.03); }

        .search-container { padding: 10px 14px 6px; }
        .action-bar { padding: 8px 14px; display: flex; gap: 8px; }
        .glass-btn { flex: 1; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--glass-card); color: var(--text-main); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .glass-btn:hover { background: rgba(255,255,255,0.12); }
        .glass-btn.primary { background: linear-gradient(135deg, #4f46e5, #6366f1); border-color: rgba(99,102,241,0.5); }

        .items-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .item-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; }
        .item-card:hover { background: rgba(255,255,255,0.08); }
        .avatar { width: 44px; height: 44px; border-radius: 14px; background: #312e81; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 5px; }
        .item-desc { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-verified { color: var(--neon-blue); font-weight: 900; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.15); position: relative; }
        @media (max-width: 767px) {
            .chat-area { position: absolute; width: 100%; height: 100%; transform: translateX(100%); transition: transform 0.3s ease; }
        }

        .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 14px; background: rgba(15, 23, 42, 0.35); }
        .btn-back { display: none; background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }
        @media (max-width: 767px) { .btn-back { display: block; } }

        .msg-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 20px; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
        .msg.out { align-self: flex-end; background: linear-gradient(135deg, #4f46e5, #6366f1); border-bottom-right-radius: 4px; }
        .msg.in { align-self: flex-start; background: rgba(255, 255, 255, 0.08); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .msg.post { align-self: center; width: 92%; max-width: 650px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 18px; padding: 16px; margin: 4px 0; }
        .msg-meta { font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 6px; text-align: right; }

        .input-bar { padding: 14px 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 12px; align-items: center; background: rgba(15, 23, 42, 0.4); }
        .input-bar input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); padding: 13px 18px; border-radius: 22px; color: #fff; outline: none; }

        .glass-modal { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .glass-modal.active { display: flex; }
        .glass-card-box {
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.18); border-radius: 24px;
            width: 100%; max-width: 380px; padding: 26px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .glass-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 14px; color: #fff; outline: none; }
        .glass-input:focus { border-color: var(--accent); }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e1b4b; border: 1px solid var(--accent); padding: 12px 22px; border-radius: 25px; font-size: 0.9rem; display: none; z-index: 200; box-shadow: var(--accent-glow); }
    </style>
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="app-window">
    <div class="sidebar" id="sidebar">
        <div class="side-header">
            <div class="logo-box">
                <div class="avatar" id="myAvatar">U</div>
                <div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span id="myUsername">MyGram</span>
                        <span id="myBadge"></span>
                    </div>
                </div>
            </div>
            <button class="glass-btn" style="flex:none; padding:8px 12px;" onclick="logout()">🚪</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabChatsBtn" onclick="switchTab('chats')">Чаты</button>
            <button class="tab-btn" id="tabChannelsBtn" onclick="switchTab('channels')">Каналы</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchBar" class="glass-input" placeholder="🔍 Поиск людей (@логин) и каналов..." oninput="handleSearch(this.value)">
        </div>

        <div class="action-bar" id="channelsActions" style="display:none;">
            <button class="glass-btn primary" onclick="openCreateChannel()">+ Создать канал</button>
        </div>

        <div class="items-list" id="itemsList"></div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="btn-back" onclick="closeChat()">←</button>
            <div class="avatar" id="chatAvatar">?</div>
            <div class="item-info">
                <div class="item-name" id="chatTitle">Выберите диалог</div>
                <div class="item-desc" id="chatStatus">онлайн</div>
            </div>
        </div>

        <div class="msg-container" id="msgBox">
            <div style="margin: auto; color: var(--text-muted); text-align: center; font-size: 0.9rem;">
                ✨ Выберите чат или канал для просмотра сообщений
            </div>
        </div>

        <div class="input-bar" id="inputBar" style="display: none;">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendAction()">
            <button class="glass-btn primary" style="flex:none; border-radius:20px; padding:12px 18px;" onclick="sendAction()">➤</button>
        </div>

        <div class="input-bar" id="subscribeBar" style="display: none;">
            <button class="glass-btn primary" id="subBtn" onclick="toggleSubscribe()" style="width:100%; border-radius:16px;">Подписаться</button>
        </div>
    </div>
</div>

<div class="glass-modal" id="modalAuth">
    <div class="glass-card-box" id="authBoxLogin">
        <h3>Вход в MyGram 🔐</h3>
        <p style="color:var(--text-muted); font-size:0.85rem;">Введите логин и пароль</p>
        <input type="text" id="loginIdent" class="glass-input" placeholder="Логин">
        <input type="password" id="loginPass" class="glass-input" placeholder="Пароль">
        <button class="glass-btn primary" onclick="submitLogin()">Войти</button>
        <p style="text-align:center; font-size:0.85rem; color:var(--text-muted); cursor:pointer;" onclick="toggleAuthForm('reg')">
            Нет аккаунта? <span style="color:var(--neon-blue);">Зарегистрироваться</span>
        </p>
    </div>

    <div class="glass-card-box" id="authBoxReg" style="display:none;">
        <h3>Регистрация 👤</h3>
        <p style="color:var(--text-muted); font-size:0.85rem;">Придумайте логин и пароль</p>
        <input type="text" id="regUser" class="glass-input" placeholder="Логин">
        <input type="password" id="regPass" class="glass-input" placeholder="Пароль (от 6 символов)">
        <button class="glass-btn primary" onclick="submitRegister()">Создать аккаунт</button>
        <p style="text-align:center; font-size:0.85rem; color:var(--text-muted); cursor:pointer;" onclick="toggleAuthForm('login')">
            Уже есть аккаунт? <span style="color:var(--neon-blue);">Войти</span>
        </p>
    </div>
</div>

<div class="glass-modal" id="modalChannel">
    <div class="glass-card-box">
        <h3>Новый канал 📢</h3>
        <input type="text" id="newChanName" class="glass-input" placeholder="Название канала">
        <input type="text" id="newChanTag" class="glass-input" placeholder="Тег (например: gaming)">
        <textarea id="newChanDesc" class="glass-input" rows="3" placeholder="Описание канала..."></textarea>
        <div style="display:flex; gap:10px;">
            <button class="glass-btn" onclick="closeModal('modalChannel')">Отмена</button>
            <button class="glass-btn primary" onclick="submitCreateChannel()">Создать</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let ws = null;
    let me = "";
    let currentTab = "chats";
    let activeChat = null;
    let searchTimeout = null;

    function initWS() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);

        ws.onopen = () => {
            const token = localStorage.getItem("mg_session_token");
            ws.send(JSON.stringify({ action: "auth_by_token", token: token || "" }));
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.action === "require_login") {
                document.getElementById("modalAuth").classList.add("active");
                toggleAuthForm('login');
            }
            else if (data.action === "auth_success") {
                document.getElementById("modalAuth").classList.remove("active");
                me = data.username;
                localStorage.setItem("mg_session_token", data.token);
                document.getElementById("myUsername").innerText = me;
                document.getElementById("myAvatar").innerText = me[0].toUpperCase();

                if (data.is_admin) {
                    document.getElementById("myBadge").innerHTML = '<span class="admin-badge">ADMIN</span>';
                } else if (data.verified) {
                    document.getElementById("myBadge").innerHTML = '<span class="badge-verified">✓</span>';
                }
                loadTabContent();
            }
            else if (data.action === "auth_error") {
                showToast(data.msg);
            }
            else if (data.action === "chat_list") {
                renderChats(data.items);
            }
            else if (data.action === "channels_list") {
                renderChannels(data.items);
            }
            else if (data.action === "search_results") {
                renderSearchResults(data.users, data.channels);
            }
            else if (data.action === "history") {
                renderHistory(data.items);
            }
            else if (data.action === "channel_history") {
                renderChannelPosts(data.items);
            }
            else if (data.action === "new_msg") {
                if (activeChat && activeChat.type === 'chat' && (activeChat.target === data.sender || data.sender === me)) {
                    appendMsg(data.sender === me, data.text, data.time);
                }
            }
            else if (data.action === "new_post") {
                if (activeChat && activeChat.type === 'channel' && activeChat.id === data.channel_id) {
                    appendPost(data.sender, data.text, data.time);
                }
            }
            else if (data.action === "sub_status") {
                if (activeChat && activeChat.type === 'channel' && activeChat.id === data.channel_id) {
                    activeChat.is_sub = data.is_sub;
                    updateChannelFooter();
                    document.getElementById("chatStatus").innerText = `${data.count} подписчиков`;
                }
            }
            else if (data.action === "channel_created") {
                closeModal('modalChannel');
                switchTab('channels');
                showToast("Канал успешно создан!");
            }
            else if (data.action === "toast") {
                showToast(data.msg);
            }
        };

        ws.onclose = () => setTimeout(initWS, 2000);
    }

    function toggleAuthForm(form) {
        document.getElementById("authBoxLogin").style.display = form === 'login' ? 'flex' : 'none';
        document.getElementById("authBoxReg").style.display = form === 'reg' ? 'flex' : 'none';
    }

    function submitLogin() {
        const id = document.getElementById("loginIdent").value.trim();
        const p = document.getElementById("loginPass").value;
        if (!id || !p) return showToast("Заполните логин и пароль");
        ws.send(JSON.stringify({ action: "login", identifier: id, password: p }));
    }

    function submitRegister() {
        const u = document.getElementById("regUser").value.trim();
        const p = document.getElementById("regPass").value;
        if (!u || !p) return showToast("Заполните все поля");
        ws.send(JSON.stringify({ action: "register", username: u, password: p }));
    }

    function logout() {
        localStorage.removeItem("mg_session_token");
        location.reload();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById("tabChatsBtn").classList.toggle("active", tab === 'chats');
        document.getElementById("tabChannelsBtn").classList.toggle("active", tab === 'channels');
        document.getElementById("channelsActions").style.display = tab === 'channels' ? 'flex' : 'none';
        document.getElementById("searchBar").value = "";
        loadTabContent();
    }

    function handleSearch(query) {
        clearTimeout(searchTimeout);
        const q = query.trim();
        if (!q) {
            loadTabContent();
            return;
        }
        searchTimeout = setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "search", query: q }));
            }
        }, 250);
    }

    function renderSearchResults(users, channels) {
        const box = document.getElementById("itemsList");
        box.innerHTML = "";

        if (!users.length && !channels.length) {
            box.innerHTML = "<div style='padding:16px;color:#94a3b8;font-size:0.85rem;'>Ничего не найдено</div>";
            return;
        }

        if (users.length) {
            box.innerHTML += "<div style='padding:6px 14px;font-size:0.75rem;color:#818cf8;font-weight:700;'>ПОЛЬЗОВАТЕЛИ</div>";
            users.forEach(u => {
                box.innerHTML += `
                    <div class="item-card" onclick="openChat('${u.username}')">
                        <div class="avatar">${u.username[0].toUpperCase()}</div>
                        <div class="item-info">
                            <div class="item-name">${u.username} ${u.verified ? '<span class="badge-verified">✓</span>' : ''}</div>
                            <div class="item-desc">Нажмите, чтобы начать диалог</div>
                        </div>
                    </div>`;
            });
        }

        if (channels.length) {
            box.innerHTML += "<div style='padding:6px 14px;font-size:0.75rem;color:#c084fc;font-weight:700;'>КАНАЛЫ</div>";
            channels.forEach(ch => {
                const vBadge = ch.verified ? '<span class="badge-verified">✓</span>' : '';
                box.innerHTML += `
                    <div class="item-card" onclick='openChannel(${JSON.stringify(ch)})'>
                        <div class="avatar" style="background:#0284c7;">📢</div>
                        <div class="item-info">
                            <div class="item-name">${ch.name} ${vBadge}</div>
                            <div class="item-desc">@${ch.tag} • ${ch.subs} подписчиков</div>
                        </div>
                    </div>`;
            });
        }
    }

    function loadTabContent() {
        if (!ws || ws.readyState !== WebSocket.OPEN || !me) return;
        if (currentTab === 'chats') ws.send(JSON.stringify({ action: "get_chats" }));
        else ws.send(JSON.stringify({ action: "get_channels" }));
    }

    function renderChats(items) {
        const box = document.getElementById("itemsList");
        box.innerHTML = items.length ? "" : "<div style='padding:16px;color:#94a3b8;font-size:0.85rem;'>Нет активных диалогов. Используйте поиск, чтобы найти людей.</div>";
        items.forEach(c => {
            box.innerHTML += `
                <div class="item-card" onclick="openChat('${c.username}')">
                    <div class="avatar">${c.username[0].toUpperCase()}</div>
                    <div class="item-info">
                        <div class="item-name">${c.username} ${c.verified ? '<span class="badge-verified">✓</span>' : ''}</div>
                        <div class="item-desc">Нажмите, чтобы открыть диалог</div>
                    </div>
                </div>`;
        });
    }

    function renderChannels(items) {
        const box = document.getElementById("itemsList");
        box.innerHTML = items.length ? "" : "<div style='padding:16px;color:#94a3b8;font-size:0.85rem;'>Каналы ещё не созданы</div>";
        items.forEach(ch => {
            const vBadge = ch.verified ? '<span class="badge-verified">✓</span>' : '';
            box.innerHTML += `
                <div class="item-card" onclick='openChannel(${JSON.stringify(ch)})'>
                    <div class="avatar" style="background:#0284c7;">📢</div>
                    <div class="item-info">
                        <div class="item-name">${ch.name} ${vBadge}</div>
                        <div class="item-desc">@${ch.tag} • ${ch.subs} подписчиков</div>
                    </div>
                </div>`;
        });
    }

    function openChat(username) {
        activeChat = { type: 'chat', target: username };
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("active");
        document.getElementById("chatTitle").innerText = username;
        document.getElementById("chatStatus").innerText = "диалог";
        document.getElementById("chatAvatar").innerText = username[0].toUpperCase();
        document.getElementById("inputBar").style.display = "flex";
        document.getElementById("subscribeBar").style.display = "none";
        document.getElementById("msgBox").innerHTML = "";
        ws.send(JSON.stringify({ action: "get_history", with: username }));
    }

    function openChannel(ch) {
        activeChat = { type: 'channel', id: ch.id, target: ch.name, owner: ch.owner, is_sub: ch.is_sub };
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("active");

        const vBadge = ch.verified ? ' <span class="badge-verified">✓</span>' : '';
        document.getElementById("chatTitle").innerHTML = `${ch.name}${vBadge}`;

        document.getElementById("chatStatus").innerText = `${ch.subs} подписчиков`;
        document.getElementById("chatAvatar").innerText = "📢";
        document.getElementById("msgBox").innerHTML = "";
        updateChannelFooter();
        ws.send(JSON.stringify({ action: "get_channel_posts", channel_id: ch.id }));
    }

    function updateChannelFooter() {
        if (!activeChat || activeChat.type !== 'channel') return;
        const isOwner = activeChat.owner === me;
        if (isOwner) {
            document.getElementById("inputBar").style.display = "flex";
            document.getElementById("subscribeBar").style.display = "none";
            document.getElementById("msgInput").placeholder = "Опубликовать в канал...";
        } else {
            document.getElementById("inputBar").style.display = "none";
            document.getElementById("subscribeBar").style.display = "flex";
            const btn = document.getElementById("subBtn");
            btn.innerText = activeChat.is_sub ? "Отписаться" : "Подписаться";
            btn.style.background = activeChat.is_sub ? "#334155" : "linear-gradient(135deg, #4f46e5, #6366f1)";
        }
    }

    function toggleSubscribe() {
        if (!activeChat || activeChat.type !== 'channel') return;
        ws.send(JSON.stringify({ action: "subscribe_channel", channel_id: activeChat.id }));
    }

    function renderHistory(items) {
        const box = document.getElementById("msgBox");
        box.innerHTML = "";
        items.forEach(m => appendMsg(m.sender === me, m.text, m.time));
    }

    function renderChannelPosts(items) {
        const box = document.getElementById("msgBox");
        box.innerHTML = "";
        items.forEach(p => appendPost(p.sender, p.text, p.time));
    }

    function appendMsg(isOut, text, time) {
        const box = document.getElementById("msgBox");
        box.innerHTML += `
            <div class="msg ${isOut ? 'out' : 'in'}">
                ${text}
                <div class="msg-meta">${time}</div>
            </div>`;
        box.scrollTop = box.scrollHeight;
    }

    function appendPost(sender, text, time) {
        const box = document.getElementById("msgBox");
        box.innerHTML += `
            <div class="msg post">
                <div style="font-weight:700; font-size:0.85rem; color:#818cf8; margin-bottom:6px;">${sender}</div>
                <div>${text}</div>
                <div class="msg-meta">${time}</div>
            </div>`;
        box.scrollTop = box.scrollHeight;
    }

    function sendAction() {
        const inp = document.getElementById("msgInput");
        const val = inp.value.trim();
        if (!val || !activeChat) return;

        if (activeChat.type === 'chat') {
            ws.send(JSON.stringify({ action: "send_msg", to: activeChat.target, text: val }));
        } else if (activeChat.type === 'channel') {
            ws.send(JSON.stringify({ action: "post_to_channel", channel_id: activeChat.id, text: val }));
        }
        inp.value = "";
    }

    function closeChat() {
        document.getElementById("sidebar").classList.remove("hidden");
        document.getElementById("chatArea").classList.remove("active");
        activeChat = null;
        loadTabContent();
    }

    function openCreateChannel() { document.getElementById("modalChannel").classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    function submitCreateChannel() {
        const name = document.getElementById("newChanName").value.trim();
        const tag = document.getElementById("newChanTag").value.trim();
        const desc = document.getElementById("newChanDesc").value.trim();
        if (!name || !tag) return showToast("Заполните имя и тег");
        ws.send(JSON.stringify({ action: "create_channel", name, tag, desc }));
    }

    function showToast(text) {
        const t = document.getElementById("toast");
        t.innerText = text;
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2500);
    }

    window.onload = initWS;
</script>
</body>
</html>
