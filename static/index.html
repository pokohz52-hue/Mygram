<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyGram</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --msg-out: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            --msg-in: rgba(255, 255, 255, 0.08);
            --blur: blur(25px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-grad); height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-main); overflow: hidden; }

        .app-window {
            width: 100%; height: 100%; display: flex; position: relative;
            background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-window { width: 92vw; height: 92vh; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        }

        .sidebar {
            width: 340px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column;
            background: rgba(15, 23, 42, 0.6); z-index: 2; transition: transform 0.3s ease;
        }

        @media (max-width: 767px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area.active { transform: translateX(0); }
        }

        .side-header { padding: 18px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .logo-box { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.5px; }
        .logo-box span { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .tabs { display: flex; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); background: rgba(255,255,255,0.03); }

        .action-bar { padding: 10px 14px; display: flex; gap: 8px; }
        .action-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-main); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: rgba(255,255,255,0.12); }

        .items-list { flex: 1; overflow-y: auto; padding: 8px; }
        .item-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; transition: 0.2s; margin-bottom: 4px; }
        .item-card:hover, .item-card.active { background: rgba(255,255,255,0.08); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #312e81; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
        .item-desc { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .badge-verified { color: #38bdf8; font-size: 0.85rem; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); position: relative; }
        @media (max-width: 767px) {
            .chat-area { position: absolute; width: 100%; height: 100%; transform: translateX(100%); transition: transform 0.3s ease; }
        }

        .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.4); }
        .btn-back { display: none; background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
        @media (max-width: 767px) { .btn-back { display: block; } }

        .msg-container { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; position: relative; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
        .msg.out { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
        .msg.in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .msg.post { align-self: center; width: 90%; max-width: 650px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; margin: 6px 0; }
        .msg-meta { font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 4px; text-align: right; }

        .input-bar { padding: 12px 18px; border-top: 1px solid var(--glass-border); display: flex; gap: 10px; align-items: center; background: rgba(15, 23, 42, 0.4); }
        .input-bar input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 20px; color: #fff; outline: none; font-size: 0.95rem; }
        .input-bar button { padding: 10px 18px; border-radius: 18px; background: var(--accent); border: none; color: #fff; font-weight: 600; cursor: pointer; }
        .sub-bar-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }

        /* Модальные окна */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: #0f172a; border: 1px solid var(--glass-border); border-radius: 20px; width: 100%; max-width: 400px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
        .modal-box h3 { font-size: 1.1rem; }
        .modal-box input, .modal-box textarea { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 10px 14px; border-radius: 12px; color: #fff; outline: none; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1b4b; border: 1px solid var(--accent); padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; display: none; z-index: 200; }
    </style>
</head>
<body>

<div class="app-window">
    <!-- БОКОВОЕ МЕНЮ -->
    <div class="sidebar" id="sidebar">
        <div class="side-header">
            <div class="logo-box">
                <div class="avatar" id="myAvatar">U</div>
                <span id="myUsername">MyGram</span>
            </div>
            <button class="action-btn" style="flex:none; padding:6px 10px;" onclick="openSearch()">🔍</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabChatsBtn" onclick="switchTab('chats')">Чаты</button>
            <button class="tab-btn" id="tabChannelsBtn" onclick="switchTab('channels')">Каналы</button>
        </div>

        <div class="action-bar" id="channelsActions" style="display:none;">
            <button class="action-btn" onclick="openCreateChannel()">+ Создать канал</button>
        </div>

        <div class="items-list" id="itemsList"></div>
    </div>

    <!-- ОКНО ЧАТА / КАНАЛА -->
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="btn-back" onclick="closeChat()">←</button>
            <div class="avatar" id="chatAvatar">?</div>
            <div class="item-info">
                <div class="item-name" id="chatTitle">Выберите диалог</div>
                <div class="item-desc" id="chatStatus">онлайн</div>
            </div>
        </div>

        <div class="msg-container" id="msgBox">
            <div style="margin: auto; color: var(--text-muted); text-align: center;">Выберите чат или канал для просмотра</div>
        </div>

        <!-- Поле ввода для лички и для автора канала -->
        <div class="input-bar" id="inputBar" style="display: none;">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendAction()">
            <button onclick="sendAction()">➤</button>
        </div>

        <!-- Кнопка Подписаться для читателей канала -->
        <div class="input-bar" id="subscribeBar" style="display: none;">
            <button class="sub-bar-btn" id="subBtn" onclick="toggleSubscribe()">Подписаться</button>
        </div>
    </div>
</div>

<!-- Модалка создания канала -->
<div class="modal" id="modalChannel">
    <div class="modal-box">
        <h3>Новый канал</h3>
        <input type="text" id="newChanName" placeholder="Название канала">
        <input type="text" id="newChanTag" placeholder="Тег (например: gaming)">
        <textarea id="newChanDesc" rows="3" placeholder="Описание канала..."></textarea>
        <div class="modal-btns">
            <button class="action-btn" onclick="closeModal('modalChannel')">Отмена</button>
            <button class="action-btn" style="background:var(--accent);" onclick="submitCreateChannel()">Создать</button>
        </div>
    </div>
</div>

<!-- Модалка поиска пользователей -->
<div class="modal" id="modalSearch">
    <div class="modal-box">
        <h3>Поиск пользователей</h3>
        <input type="text" id="searchInput" placeholder="Введите никнейм..." oninput="doSearch()">
        <div id="searchResults" style="max-height: 200px; overflow-y: auto;"></div>
        <div class="modal-btns">
            <button class="action-btn" onclick="closeModal('modalSearch')">Закрыть</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let ws = null;
    let me = "";
    let currentTab = "chats";
    let activeChat = null; // { type: 'chat'|'channel', target: '...', id: 1, owner: '...' }
    let channelsList = [];

    function getDeviceId() {
        let id = localStorage.getItem("mg_device_id");
        if (!id) {
            id = "dev_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem("mg_device_id", id);
        }
        return id;
    }

    function initWS() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);

        ws.onopen = () => {
            ws.send(JSON.stringify({ action: "device_init", device_id: getDeviceId() }));
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);

            if (data.action === "auth_need_reg") {
                let u = prompt("Введите никнейм для регистрации:");
                if (u) ws.send(JSON.stringify({ action: "device_register", device_id: getDeviceId(), username: u }));
            }
            else if (data.action === "auth_success") {
                me = data.username;
                document.getElementById("myUsername").innerText = me;
                document.getElementById("myAvatar").innerText = me[0].toUpperCase();
                loadTabContent();
            }
            else if (data.action === "chat_list") {
                renderChats(data.items);
            }
            else if (data.action === "channels_list") {
                channelsList = data.items;
                renderChannels(data.items);
            }
            else if (data.action === "history") {
                renderHistory(data.items);
            }
            else if (data.action === "channel_history") {
                renderChannelPosts(data.items);
            }
            else if (data.action === "new_msg") {
                if (activeChat && activeChat.type === 'chat' && (activeChat.target === data.sender || data.sender === me)) {
                    appendMsg(data.sender === me, data.text, data.time);
                }
            }
            else if (data.action === "new_post") {
                if (activeChat && activeChat.type === 'channel' && activeChat.id === data.channel_id) {
                    appendPost(data.sender, data.text, data.time);
                }
            }
            else if (data.action === "sub_status") {
                if (activeChat && activeChat.type === 'channel' && activeChat.id === data.channel_id) {
                    activeChat.is_sub = data.is_sub;
                    updateChannelFooter();
                    document.getElementById("chatStatus").innerText = `${data.count} подписчиков`;
                }
            }
            else if (data.action === "channel_created") {
                closeModal('modalChannel');
                switchTab('channels');
                showToast("Канал успешно создан!");
            }
            else if (data.action === "toast") {
                showToast(data.msg);
            }
        };

        ws.onclose = () => setTimeout(initWS, 2000);
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById("tabChatsBtn").classList.toggle("active", tab === 'chats');
        document.getElementById("tabChannelsBtn").classList.toggle("active", tab === 'channels');
        document.getElementById("channelsActions").style.display = tab === 'channels' ? 'flex' : 'none';
        loadTabContent();
    }

    function loadTabContent() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (currentTab === 'chats') ws.send(JSON.stringify({ action: "get_chats" }));
        else ws.send(JSON.stringify({ action: "get_channels" }));
    }

    function renderChats(items) {
        const box = document.getElementById("itemsList");
        box.innerHTML = items.length ? "" : "<div style='padding:16px;color:#94a3b8;'>Нет активных диалогов</div>";
        items.forEach(c => {
            box.innerHTML += `
                <div class="item-card" onclick="openChat('${c.username}', false)">
                    <div class="avatar">${c.username[0].toUpperCase()}</div>
                    <div class="item-info">
                        <div class="item-name">${c.username} ${c.verified ? '<span class="badge-verified">✓</span>' : ''}</div>
                        <div class="item-desc">Нажмите, чтобы открыть диалог</div>
                    </div>
                </div>`;
        });
    }

    function renderChannels(items) {
        const box = document.getElementById("itemsList");
        box.innerHTML = items.length ? "" : "<div style='padding:16px;color:#94a3b8;'>Каналы ещё не созданы</div>";
        items.forEach(ch => {
            box.innerHTML += `
                <div class="item-card" onclick='openChannel(${JSON.stringify(ch)})'>
                    <div class="avatar">📢</div>
                    <div class="item-info">
                        <div class="item-name">${ch.name}</div>
                        <div class="item-desc">@${ch.tag} • ${ch.subs} подписчиков</div>
                    </div>
                </div>`;
        });
    }

    function openChat(username) {
        activeChat = { type: 'chat', target: username };
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("active");
        document.getElementById("chatTitle").innerText = username;
        document.getElementById("chatStatus").innerText = "диалог";
        document.getElementById("chatAvatar").innerText = username[0].toUpperCase();
        document.getElementById("inputBar").style.display = "flex";
        document.getElementById("subscribeBar").style.display = "none";
        document.getElementById("msgBox").innerHTML = "";
        ws.send(JSON.stringify({ action: "get_history", with: username }));
    }

    function openChannel(ch) {
        activeChat = { type: 'channel', id: ch.id, target: ch.name, owner: ch.owner, is_sub: ch.is_sub };
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("active");
        document.getElementById("chatTitle").innerText = ch.name;
        document.getElementById("chatStatus").innerText = `${ch.subs} подписчиков`;
        document.getElementById("chatAvatar").innerText = "📢";
        document.getElementById("msgBox").innerHTML = "";
        updateChannelFooter();
        ws.send(JSON.stringify({ action: "get_channel_posts", channel_id: ch.id }));
    }

    function updateChannelFooter() {
        if (!activeChat || activeChat.type !== 'channel') return;
        const isOwner = activeChat.owner === me;
        if (isOwner) {
            document.getElementById("inputBar").style.display = "flex";
            document.getElementById("subscribeBar").style.display = "none";
            document.getElementById("msgInput").placeholder = "Опубликовать в канал...";
        } else {
            document.getElementById("inputBar").style.display = "none";
            document.getElementById("subscribeBar").style.display = "flex";
            const btn = document.getElementById("subBtn");
            btn.innerText = activeChat.is_sub ? "Отписаться" : "Подписаться";
            btn.style.background = activeChat.is_sub ? "#334155" : "var(--accent)";
        }
    }

    function toggleSubscribe() {
        if (!activeChat || activeChat.type !== 'channel') return;
        ws.send(JSON.stringify({ action: "subscribe_channel", channel_id: activeChat.id }));
    }

    function renderHistory(items) {
        const box = document.getElementById("msgBox");
        box.innerHTML = "";
        items.forEach(m => appendMsg(m.sender === me, m.text, m.time));
    }

    function renderChannelPosts(items) {
        const box = document.getElementById("msgBox");
        box.innerHTML = "";
        items.forEach(p => appendPost(p.sender, p.text, p.time));
    }

    function appendMsg(isOut, text, time) {
        const box = document.getElementById("msgBox");
        box.innerHTML += `
            <div class="msg ${isOut ? 'out' : 'in'}">
                ${text}
                <div class="msg-meta">${time}</div>
            </div>`;
        box.scrollTop = box.scrollHeight;
    }

    function appendPost(sender, text, time) {
        const box = document.getElementById("msgBox");
        box.innerHTML += `
            <div class="msg post">
                <div style="font-weight:700; font-size:0.85rem; color:#818cf8; margin-bottom:4px;">${sender}</div>
                <div>${text}</div>
                <div class="msg-meta">${time}</div>
            </div>`;
        box.scrollTop = box.scrollHeight;
    }

    function sendAction() {
        const inp = document.getElementById("msgInput");
        const val = inp.value.trim();
        if (!val || !activeChat) return;

        if (activeChat.type === 'chat') {
            ws.send(JSON.stringify({ action: "send_msg", to: activeChat.target, text: val }));
        } else if (activeChat.type === 'channel') {
            ws.send(JSON.stringify({ action: "post_to_channel", channel_id: activeChat.id, text: val }));
        }
        inp.value = "";
    }

    function closeChat() {
        document.getElementById("sidebar").classList.remove("hidden");
        document.getElementById("chatArea").classList.remove("active");
        activeChat = null;
        loadTabContent();
    }

    function openCreateChannel() { document.getElementById("modalChannel").classList.add("active"); }
    function openSearch() { document.getElementById("modalSearch").classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    function submitCreateChannel() {
        const name = document.getElementById("newChanName").value.trim();
        const tag = document.getElementById("newChanTag").value.trim();
        const desc = document.getElementById("newChanDesc").value.trim();
        if (!name || !tag) return showToast("Заполните имя и тег");
        ws.send(JSON.stringify({ action: "create_channel", name, tag, desc }));
    }

    function showToast(text) {
        const t = document.getElementById("toast");
        t.innerText = text;
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2500);
    }

    window.onload = initWS;
</script>
</body>
</html>
